<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculadora - Estilo Android</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="calculator">
      <div class="display">
        <div id="history-display" class="history-text"></div>
        <input
          type="text"
          id="result-display"
          class="result-input"
          value="0"
          readonly
        />
      </div>

      <div class="nav-buttons">
        <button class="nav-btn" onclick="toggleHistory()">Histórico</button>
        <button class="nav-btn" onclick="window.location.href='tabuada.html'">
          Tabuada
        </button>
        <button class="nav-btn" onclick="window.open('ajuda.pdf', '_blank')">
          ?
        </button>
      </div>

      <div class="buttons">
        <button class="btn fn-btn" data-value="C">C</button>
        <button class="btn fn-btn" data-value="root">√</button>
        <button class="btn fn-btn" data-value="%">%</button>
        <button class="btn op-btn" data-value="/">÷</button>

        <button class="btn num-btn" data-value="7">7</button>
        <button class="btn num-btn" data-value="8">8</button>
        <button class="btn num-btn" data-value="9">9</button>
        <button class="btn op-btn" data-value="*">×</button>

        <button class="btn num-btn" data-value="4">4</button>
        <button class="btn num-btn" data-value="5">5</button>
        <button class="btn num-btn" data-value="6">6</button>
        <button class="btn op-btn" data-value="-">-</button>

        <button class="btn num-btn" data-value="1">1</button>
        <button class="btn num-btn" data-value="2">2</button>
        <button class="btn num-btn" data-value="3">3</button>
        <button class="btn op-btn" data-value="+">+</button>

        <button class="btn num-btn zero-btn" data-value="0">0</button>
        <button class="btn num-btn" data-value=".">.</button>
        <button class="btn op-btn equal-btn" data-value="=">=</button>
      </div>
    </div>

    <div id="history-modal" class="history-modal">
      <div class="history-content">
        <h3>Histórico de Cálculos</h3>
        <ul id="history-list"></ul>
        <button class="close-btn" onclick="toggleHistory()">Fechar</button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
